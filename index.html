<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { background: transparent; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <audio id="player" src="https://stream.zeno.fm/f3wvbbqmdg8uv" autoplay loop crossorigin="anonymous" playsinline></audio>
  <script>
    const audio = document.getElementById('player');
    audio.volume = 0.12;

    // Retry connection if stream drops
    audio.addEventListener('error', () => {
      setTimeout(() => {
        audio.src = "https://stream.zeno.fm/f3wvbbqmdg8uv";
        audio.load();
        audio.play().catch(() => {});
      }, 3000);
    });
  </script>
</body>
</html>
