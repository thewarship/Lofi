<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <audio id="player" src="https://ice1.somafm.com/groovesalad-128-mp3" autoplay loop crossorigin="anonymous" playsinline></audio>

  <script>
    const audio = document.getElementById('player');
    
    // Set to 3% background volume
    audio.volume = 0.03;

    // Auto-start for Moblin
    audio.play().catch(() => {});

    // Invisible click trigger for desktop browser testing
    document.body.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
