<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { background: transparent; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <!-- Updated working direct Lofi audio stream -->
  <audio id="player" src="https://play.streamaudio.de/lofi" autoplay loop crossorigin="anonymous" playsinline></audio>
