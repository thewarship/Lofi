<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <script>
    // Create audio instance with CORS enabled
    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    audio.src = "https://ice1.somafm.com/groovesalad-128-mp3";
    audio.loop = true;

    // Web Audio API context setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    const source = audioCtx.createMediaElementSource(audio);
    const gainNode = audioCtx.createGain();

    // Digital volume control (0.02 = 2%)
    gainNode.gain.value = 0.02;

    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const playStream = () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play().catch(err => console.log("Playback error:", err));
    };

    // Auto-attempt playback
    playStream();

    // Click handler for testing in standard desktop browsers
    document.body.addEventListener('click', () => {
      if (audio.paused) {
        playStream();
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
