<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <audio id="player" src="https://ice1.somafm.com/groovesalad-128-mp3" autoplay loop crossorigin="anonymous" playsinline></audio>

  <script>
    const audio = document.getElementById('player');
    
    // Web Audio API gain processing to bypass mobile WebView volume restrictions
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    const source = audioCtx.createMediaElementSource(audio);
    const gainNode = audioCtx.createGain();

    // Set gain level (0.02 = 2% volume output)
    gainNode.gain.value = 0.02;

    // Connect stream -> volume control -> output
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // Auto-start playback and resume audio context
    const startAudio = () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play().catch(() => {});
    };

    startAudio();

    // Invisible click trigger for desktop browser testing
    document.body.addEventListener('click', () => {
      startAudio();
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
