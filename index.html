<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>Click anywhere to play / pause Lofi</h2>

  <audio id="player" src="https://ice1.somafm.com/groovesalad-128-mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('player');
    audio.volume = 0.12;

    document.body.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(e => console.log('Playback error:', e));
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
